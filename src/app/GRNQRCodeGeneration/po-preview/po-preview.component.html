<div class="col-xl-12">
    <div class="card" style="background-color: beige">
      <div class="card-body">
        <h4 class="card-title">PO Preview</h4>
        <form class="needs-validation" [formGroup]="validationform" (ngSubmit)="openMe23()">
          <div class="row">
            <div class="col-md-2">
              <label class="brandcolor" for="poNum">PO Number</label>
              <div class="mb-3">
                <input
                  type="text"
                  class="form-control"
                  id="poNum"
                  formControlName="poNum"
                  placeholder="PO Number"
                  [ngClass]="{ 'is-invalid': submit && validationform.get('poNum')?.errors }"
                />
                <div *ngIf="submit && validationform.get('poNum')?.errors" class="invalid-feedback">
                  <span *ngIf="validationform.get('poNum')?.errors.required">
                    Please provide a valid PO Number.
                  </span>
                </div>
              </div>
            </div>
            <div class="col-md-1 mt-4">
              <button
                style="background-color: brown; width: max-content; color: aliceblue;"
                class="btn"
                type="submit"
              >
                Preview
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
